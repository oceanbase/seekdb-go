name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-bundles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify bundle checksums and contents
        run: python3 scripts/verify_bundles.py
      - name: Test release safety checks
        run: python3 -m unittest discover -s scripts/tests -v

  go-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-26
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-amd64
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false
      - name: Test checked-out platform bundle
        env:
          SEEKDB_TEST_ARTIFACT_DIR: ${{ runner.temp }}/seekdb-tests/checked-out
        run: |
          cp go.work.dev go.work
          set -o pipefail
          mkdir -p "$SEEKDB_TEST_ARTIFACT_DIR"
          go test -v -count=1 -timeout=10m ./... 2>&1 | tee "$SEEKDB_TEST_ARTIFACT_DIR/api.log"
          (cd examples/sql && go test -v -count=1 -timeout=10m .) 2>&1 | tee "$SEEKDB_TEST_ARTIFACT_DIR/sql.log"
      - name: Test downloaded native modules
        env:
          GOWORK: 'off'
          GOENV: 'off'
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOPRIVATE: ''
          GONOPROXY: ''
          GONOSUMDB: ''
          GOINSECURE: ''
          SEEKDB_TEST_ARTIFACT_DIR: ${{ runner.temp }}/seekdb-tests/downloaded
        run: |
          set -o pipefail
          mkdir -p "$SEEKDB_TEST_ARTIFACT_DIR"
          go test -mod=readonly -v -count=1 -timeout=10m ./... 2>&1 | tee "$SEEKDB_TEST_ARTIFACT_DIR/api.log"
          (cd examples/sql && go test -mod=readonly -v -count=1 -timeout=10m .) 2>&1 | tee "$SEEKDB_TEST_ARTIFACT_DIR/sql.log"
      - name: Set up Python for packaging checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test portable release input validation and native packaging
        run: python -m unittest discover -s scripts/tests -p test_packaging.py -v
      - name: Preserve failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failure-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/seekdb-tests/**/*.log
            ${{ runner.temp }}/seekdb-tests/**/log/
